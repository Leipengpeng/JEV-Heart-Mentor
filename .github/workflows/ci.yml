name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python -m unittest discover -s tests
        env:
          CHATLENS_DATA_DIR: ${{ runner.temp }}/chatlens-test-data
      - run: node --test tests/*.js
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python scripts/export_release.py
  macos-native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/build_macos.py
      - run: build/ChatLens.app/Contents/MacOS/ChatLens --stability-self-test
      - run: build/ChatLens.app/Contents/MacOS/ChatLens --layout-self-test
      - run: build/WeChatClickObserver --stability-self-test
      - run: build/WeChatClickObserver --contact-self-test
